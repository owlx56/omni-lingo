<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>OneLingo</title>
    <link rel="stylesheet" href="pdf_viewer.css" />
    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="onelingo-viewer.css" />
    <script src="/pdf-bridge.js"></script>
    <script src="../build/pdf.js"></script>
    <script src="pdf_viewer.js"></script>
    <script type="module" src="viewer.mjs"></script>
  </head>
  <body>
    <div id="outerContainer">
      <div id="toolbarContainer" data-onelingo-reader-ui>
        <div class="toolbar" id="toolbarViewer">
          <div id="toolbarViewerLeft">
            <button
              class="toolbarButton pdfIconButton"
              id="sidebarToggle"
              type="button"
              aria-expanded="false"
              aria-controls="sidebarContainer"
              data-l10n-title="managePages"
              data-l10n-aria-label="managePages"
            >
              <span class="visuallyHidden" data-l10n-text="managePages"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton"
              id="findToggle"
              type="button"
              aria-expanded="false"
              aria-controls="findbar"
              data-l10n-title="findInDocument"
              data-l10n-aria-label="findInDocument"
            >
              <span class="visuallyHidden" data-l10n-text="findInDocument"></span>
            </button>
            <span class="toolbarSeparator" aria-hidden="true"></span>
            <button
              class="toolbarButton pdfIconButton"
              id="previous"
              type="button"
              data-l10n-title="previousPage"
              data-l10n-aria-label="previousPage"
            >
              <span class="visuallyHidden" data-l10n-text="previousPage"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton"
              id="next"
              type="button"
              data-l10n-title="nextPage"
              data-l10n-aria-label="nextPage"
            >
              <span class="visuallyHidden" data-l10n-text="nextPage"></span>
            </button>
            <span class="toolbarPageControls">
              <input
                id="pageNumber"
                type="number"
                min="1"
                value="1"
                autocomplete="off"
                data-l10n-title="page"
                data-l10n-aria-label="page"
              />
              <span id="numPages" class="toolbarLabel">/ 0</span>
            </span>
          </div>
          <div id="toolbarViewerMiddle">
            <button
              class="toolbarButton pdfIconButton"
              id="zoomOut"
              type="button"
              data-l10n-title="zoomOut"
              data-l10n-aria-label="zoomOut"
            >
              <span class="visuallyHidden" data-l10n-text="zoomOut"></span>
            </button>
            <div id="scaleSelectContainer" class="dropdownToolbarButton">
              <select
                id="scaleSelect"
                class="scaleNativeSelect"
                data-l10n-title="zoom"
                data-l10n-aria-label="zoom"
                tabindex="-1"
              >
                <option value="auto" selected data-l10n-text="scaleAuto"></option>
                <option value="page-width" data-l10n-text="scalePageWidth"></option>
                <option value="page-fit" data-l10n-text="scalePageFit"></option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
              <button
                id="scaleSelectButton"
                class="scaleSelectButton"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="scaleSelectMenu"
                data-l10n-title="zoom"
                data-l10n-aria-label="zoom"
              >
                <span
                  id="scaleSelectValue"
                  class="scaleSelectValue"
                  data-l10n-text="scaleAuto"
                ></span>
                <span class="scaleSelectChevron" aria-hidden="true"></span>
              </button>
              <div
                id="scaleSelectMenu"
                class="scaleSelectMenu"
                role="listbox"
                data-l10n-aria-label="zoom"
                hidden
              ></div>
            </div>
            <button
              class="toolbarButton pdfIconButton"
              id="zoomIn"
              type="button"
              data-l10n-title="zoomIn"
              data-l10n-aria-label="zoomIn"
            >
              <span class="visuallyHidden" data-l10n-text="zoomIn"></span>
            </button>
          </div>
          <div id="toolbarViewerRight">
            <button
              class="toolbarButton pdfIconButton editorButton"
              id="editorHighlight"
              type="button"
              aria-pressed="false"
              data-editor-mode="highlight"
              data-l10n-title="highlight"
              data-l10n-aria-label="highlight"
            >
              <span class="visuallyHidden" data-l10n-text="highlight"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton editorButton"
              id="editorFreeText"
              type="button"
              aria-pressed="false"
              data-editor-mode="freeText"
              data-l10n-title="text"
              data-l10n-aria-label="text"
            >
              <span class="visuallyHidden" data-l10n-text="text"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton editorButton"
              id="editorInk"
              type="button"
              aria-pressed="false"
              data-editor-mode="ink"
              data-l10n-title="draw"
              data-l10n-aria-label="draw"
            >
              <span class="visuallyHidden" data-l10n-text="draw"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton editorButton"
              id="editorStamp"
              type="button"
              aria-pressed="false"
              data-editor-mode="stamp"
              data-l10n-title="addImage"
              data-l10n-aria-label="addImage"
            >
              <span class="visuallyHidden" data-l10n-text="addImage"></span>
            </button>
            <span class="toolbarSeparator" aria-hidden="true"></span>
            <button
              class="toolbarButton pdfIconButton"
              id="openFile"
              type="button"
              data-l10n-title="openFile"
              data-l10n-aria-label="openFile"
            >
              <span class="visuallyHidden" data-l10n-text="openFile"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton"
              id="print"
              type="button"
              data-l10n-title="print"
              data-l10n-aria-label="print"
            >
              <span class="visuallyHidden" data-l10n-text="print"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton"
              id="download"
              type="button"
              data-l10n-title="save"
              data-l10n-aria-label="save"
            >
              <span class="visuallyHidden" data-l10n-text="save"></span>
            </button>
            <button
              class="toolbarButton pdfIconButton"
              id="secondaryToolbarToggle"
              type="button"
              aria-expanded="false"
              aria-controls="secondaryToolbar"
              data-l10n-title="tools"
              data-l10n-aria-label="tools"
            >
              <span class="visuallyHidden" data-l10n-text="tools"></span>
            </button>
          </div>
        </div>
      </div>

      <div id="findbar" class="findbar" data-onelingo-reader-ui hidden>
        <input
          id="findInput"
          type="search"
          autocomplete="off"
          data-l10n-title="find"
          data-l10n-placeholder="findInDocument"
          data-l10n-aria-label="findInDocument"
        />
        <button
          class="toolbarButton pdfIconButton findbarButton"
          id="findPrevious"
          type="button"
          data-l10n-title="findPrevious"
          data-l10n-aria-label="findPrevious"
        >
          <span class="visuallyHidden" data-l10n-text="findPrevious"></span>
        </button>
        <button
          class="toolbarButton pdfIconButton findbarButton"
          id="findNext"
          type="button"
          data-l10n-title="findNext"
          data-l10n-aria-label="findNext"
        >
          <span class="visuallyHidden" data-l10n-text="findNext"></span>
        </button>
        <span id="findResultsCount" class="toolbarLabel"></span>
        <span id="findMsg" class="toolbarLabel"></span>
        <label class="findOption">
          <input id="findHighlightAll" type="checkbox" checked />
          <span data-l10n-text="highlightAll"></span>
        </label>
        <label class="findOption">
          <input id="findMatchCase" type="checkbox" />
          <span data-l10n-text="matchCase"></span>
        </label>
        <label class="findOption">
          <input id="findEntireWord" type="checkbox" />
          <span data-l10n-text="wholeWords"></span>
        </label>
        <label class="findOption">
          <input id="findMatchDiacritics" type="checkbox" checked />
          <span data-l10n-text="matchDiacritics"></span>
        </label>
        <button
          class="toolbarButton iconTextButton"
          id="findClose"
          type="button"
          data-l10n-title="close"
          data-l10n-aria-label="closeFindbar"
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div id="loadingBar" data-onelingo-reader-ui>
        <div id="loadingBarProgress"></div>
      </div>

      <div id="sidebarContainer" data-onelingo-reader-ui hidden>
        <div class="sidebarHeader">
          <div class="sidebarTabs" role="tablist">
            <button
              class="sidebarTab selected"
              id="viewThumbnail"
              type="button"
              role="tab"
              aria-selected="true"
              data-sidebar-view="thumbnails"
              data-l10n-title="pages"
              data-l10n-aria-label="pages"
            >
              <span class="sidebarTabIcon sidebarTabIconPages" aria-hidden="true"></span>
              <span class="sidebarTabLabel" data-l10n-text="pages"></span>
            </button>
            <button
              class="sidebarTab"
              id="viewOutline"
              type="button"
              role="tab"
              aria-selected="false"
              data-sidebar-view="outline"
              data-l10n-title="outline"
              data-l10n-aria-label="outline"
            >
              <span class="sidebarTabIcon sidebarTabIconOutline" aria-hidden="true"></span>
              <span class="sidebarTabLabel" data-l10n-text="outline"></span>
            </button>
            <button
              class="sidebarTab"
              id="viewAttachments"
              type="button"
              role="tab"
              aria-selected="false"
              data-sidebar-view="attachments"
              data-l10n-title="attachments"
              data-l10n-aria-label="attachments"
            >
              <span class="sidebarTabIcon sidebarTabIconAttachments" aria-hidden="true"></span>
              <span class="sidebarTabLabel" data-l10n-text="attachments"></span>
            </button>
          </div>
        </div>
        <div id="sidebarContent">
          <div id="thumbnailView" class="sidebarView"></div>
          <div id="outlineView" class="sidebarView" hidden></div>
          <div id="attachmentsView" class="sidebarView" hidden></div>
        </div>
        <div
          id="sidebarResizer"
          aria-hidden="true"
          data-onelingo-reader-ui
        ></div>
      </div>

      <div id="secondaryToolbar" data-onelingo-reader-ui role="menu" hidden>
        <div class="secondaryToolbarSection">
          <button
            class="secondaryToolbarButton"
            id="secondaryOpenFile"
            type="button"
            role="menuitem"
            data-l10n-text="openFile"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="presentationMode"
            type="button"
            role="menuitem"
            data-l10n-text="presentationMode"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="currentPage"
            type="button"
            role="menuitem"
            data-l10n-text="currentPage"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection">
          <button
            class="secondaryToolbarButton"
            id="firstPage"
            type="button"
            role="menuitem"
            data-l10n-text="firstPage"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="lastPage"
            type="button"
            role="menuitem"
            data-l10n-text="lastPage"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection">
          <button
            class="secondaryToolbarButton"
            id="rotateCw"
            type="button"
            role="menuitem"
            data-l10n-text="rotateCw"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="rotateCcw"
            type="button"
            role="menuitem"
            data-l10n-text="rotateCcw"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection" role="group">
          <button
            class="secondaryToolbarButton"
            id="cursorSelectTool"
            type="button"
            role="menuitemradio"
            aria-checked="true"
            data-cursor-tool="select"
            data-l10n-text="textSelectTool"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="cursorHandTool"
            type="button"
            role="menuitemradio"
            aria-checked="false"
            data-cursor-tool="hand"
            data-l10n-text="handTool"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection" role="group">
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="page"
            data-l10n-text="pageScrolling"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="vertical"
            data-l10n-text="verticalScrolling"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="horizontal"
            data-l10n-text="horizontalScrolling"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="wrapped"
            data-l10n-text="wrappedScrolling"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection" role="group">
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="none"
            data-l10n-text="noSpreads"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="odd"
            data-l10n-text="oddSpreads"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="even"
            data-l10n-text="evenSpreads"
          >
          </button>
        </div>
        <div class="secondaryToolbarSection">
          <button
            class="secondaryToolbarButton"
            id="documentProperties"
            type="button"
            role="menuitem"
            data-l10n-text="documentProperties"
          >
          </button>
          <button
            class="secondaryToolbarButton"
            id="secondaryDownload"
            type="button"
            role="menuitem"
            data-l10n-text="save"
          >
          </button>
        </div>
      </div>

      <div id="viewerContainer" tabindex="0">
        <div id="viewer" class="pdfViewer"></div>
      </div>

      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
      <div id="errorWrapper" data-onelingo-reader-ui hidden>
        <div id="errorMessage"></div>
      </div>
      <dialog id="propertiesDialog" data-onelingo-reader-ui>
        <form method="dialog" id="propertiesForm">
          <div class="dialogHeader">
            <h1 data-l10n-text="documentProperties"></h1>
            <button
              class="toolbarButton iconTextButton"
              id="propertiesClose"
              type="submit"
              data-l10n-aria-label="close"
            >
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <dl id="propertiesList"></dl>
        </form>
      </dialog>
    </div>
  </body>
</html>
