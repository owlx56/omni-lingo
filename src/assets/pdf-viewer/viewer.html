<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>OneLingo PDF Reader</title>
    <link rel="stylesheet" href="pdf_viewer.css" />
    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="onelingo-viewer.css" />
    <script src="/pdf-bridge.js"></script>
    <script type="module" src="viewer.mjs"></script>
  </head>
  <body>
    <div id="outerContainer">
      <div id="toolbarContainer" data-onelingo-reader-ui>
        <div class="toolbar" id="toolbarViewer">
          <div id="toolbarViewerLeft">
            <button
              class="toolbarButton iconButton"
              id="sidebarToggle"
              type="button"
              title="Toggle sidebar"
              aria-label="Toggle sidebar"
              aria-expanded="false"
              aria-controls="sidebarContainer"
            >
              <span aria-hidden="true">☰</span>
            </button>
            <button
              class="toolbarButton iconButton"
              id="findToggle"
              type="button"
              title="Find in document"
              aria-label="Find in document"
              aria-expanded="false"
              aria-controls="findbar"
            >
              <span aria-hidden="true">⌕</span>
            </button>
            <button
              class="toolbarButton"
              id="openFile"
              type="button"
              title="Open file"
              aria-label="Open file"
            >
              Open
            </button>
            <button
              class="toolbarButton"
              id="previous"
              type="button"
              title="Previous page"
              aria-label="Previous page"
            >
              Previous
            </button>
            <button
              class="toolbarButton"
              id="next"
              type="button"
              title="Next page"
              aria-label="Next page"
            >
              Next
            </button>
            <span class="toolbarPageControls">
              <input
                id="pageNumber"
                type="number"
                min="1"
                value="1"
                autocomplete="off"
                aria-label="Page"
              />
              <span id="numPages" class="toolbarLabel">/ 0</span>
            </span>
          </div>
          <div id="toolbarViewerMiddle">
            <button
              class="toolbarButton"
              id="zoomOut"
              type="button"
              title="Zoom out"
              aria-label="Zoom out"
            >
              -
            </button>
            <div id="scaleSelectContainer" class="dropdownToolbarButton">
              <select id="scaleSelect" title="Zoom" aria-label="Zoom">
                <option value="auto" selected>Auto</option>
                <option value="page-width">Page Width</option>
                <option value="page-fit">Page Fit</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
            </div>
            <button
              class="toolbarButton"
              id="zoomIn"
              type="button"
              title="Zoom in"
              aria-label="Zoom in"
            >
              +
            </button>
          </div>
          <div id="toolbarViewerRight">
            <button
              class="toolbarButton"
              id="download"
              type="button"
              title="Download"
              aria-label="Download"
            >
              Download
            </button>
            <button
              class="toolbarButton iconButton"
              id="secondaryToolbarToggle"
              type="button"
              title="Tools"
              aria-label="Tools"
              aria-expanded="false"
              aria-controls="secondaryToolbar"
            >
              <span aria-hidden="true">⋯</span>
            </button>
          </div>
        </div>
      </div>

      <div id="findbar" class="findbar" data-onelingo-reader-ui hidden>
        <input
          id="findInput"
          type="search"
          autocomplete="off"
          placeholder="Find in document"
          aria-label="Find in document"
        />
        <button class="toolbarButton" id="findPrevious" type="button">Previous</button>
        <button class="toolbarButton" id="findNext" type="button">Next</button>
        <span id="findResultsCount" class="toolbarLabel"></span>
        <span id="findMsg" class="toolbarLabel"></span>
        <label class="findOption">
          <input id="findHighlightAll" type="checkbox" checked />
          <span>Highlight all</span>
        </label>
        <label class="findOption">
          <input id="findMatchCase" type="checkbox" />
          <span>Match case</span>
        </label>
        <label class="findOption">
          <input id="findEntireWord" type="checkbox" />
          <span>Whole words</span>
        </label>
        <label class="findOption">
          <input id="findMatchDiacritics" type="checkbox" checked />
          <span>Diacritics</span>
        </label>
        <button
          class="toolbarButton iconButton"
          id="findClose"
          type="button"
          title="Close"
          aria-label="Close find bar"
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div id="loadingBar" data-onelingo-reader-ui>
        <div id="loadingBarProgress"></div>
      </div>

      <div id="sidebarContainer" data-onelingo-reader-ui hidden>
        <div class="sidebarHeader">
          <div class="sidebarTabs" role="tablist" aria-label="Document views">
            <button
              class="sidebarTab selected"
              id="viewThumbnail"
              type="button"
              role="tab"
              aria-selected="true"
              data-sidebar-view="thumbnails"
            >
              Pages
            </button>
            <button
              class="sidebarTab"
              id="viewOutline"
              type="button"
              role="tab"
              aria-selected="false"
              data-sidebar-view="outline"
            >
              Outline
            </button>
            <button
              class="sidebarTab"
              id="viewAttachments"
              type="button"
              role="tab"
              aria-selected="false"
              data-sidebar-view="attachments"
            >
              Files
            </button>
          </div>
        </div>
        <div id="sidebarContent">
          <div id="thumbnailView" class="sidebarView"></div>
          <div id="outlineView" class="sidebarView" hidden></div>
          <div id="attachmentsView" class="sidebarView" hidden></div>
        </div>
      </div>

      <div id="secondaryToolbar" data-onelingo-reader-ui hidden>
        <div class="secondaryToolbarSection">
          <button class="secondaryToolbarButton" id="firstPage" type="button">
            First page
          </button>
          <button class="secondaryToolbarButton" id="lastPage" type="button">
            Last page
          </button>
        </div>
        <div class="secondaryToolbarSection">
          <button class="secondaryToolbarButton" id="rotateCw" type="button">
            Rotate clockwise
          </button>
          <button class="secondaryToolbarButton" id="rotateCcw" type="button">
            Rotate counterclockwise
          </button>
        </div>
        <div class="secondaryToolbarSection" role="group" aria-label="Scroll mode">
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="vertical"
          >
            Vertical scrolling
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="horizontal"
          >
            Horizontal scrolling
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="wrapped"
          >
            Wrapped scrolling
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-scroll-mode="page"
          >
            Page scrolling
          </button>
        </div>
        <div class="secondaryToolbarSection" role="group" aria-label="Spread mode">
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="none"
          >
            No spreads
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="odd"
          >
            Odd spreads
          </button>
          <button
            class="secondaryToolbarButton"
            type="button"
            role="menuitemradio"
            data-spread-mode="even"
          >
            Even spreads
          </button>
        </div>
        <div class="secondaryToolbarSection">
          <button class="secondaryToolbarButton" id="documentProperties" type="button">
            Document properties
          </button>
          <button class="secondaryToolbarButton" id="secondaryOpenFile" type="button">
            Open file
          </button>
          <button class="secondaryToolbarButton" id="secondaryDownload" type="button">
            Download
          </button>
        </div>
      </div>

      <div id="viewerContainer" tabindex="0">
        <div id="viewer" class="pdfViewer"></div>
      </div>

      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
      <div id="errorWrapper" data-onelingo-reader-ui hidden>
        <div id="errorMessage"></div>
      </div>
      <dialog id="propertiesDialog" data-onelingo-reader-ui>
        <form method="dialog" id="propertiesForm">
          <div class="dialogHeader">
            <h1>Document properties</h1>
            <button
              class="toolbarButton iconButton"
              id="propertiesClose"
              type="submit"
              aria-label="Close"
            >
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <dl id="propertiesList"></dl>
        </form>
      </dialog>
    </div>
  </body>
</html>
